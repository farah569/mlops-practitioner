name: CI Pipeline

on:
  push:
    branches: [ main, final-project-rag ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff black
      - run: ruff check src tests
      - run: black --check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU torch (small)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install RAG dependencies
        run: pip install -r requirements-rag.txt
      - name: Install project with dev extras
        run: pip install -e ".[dev]"
      - run: pytest -v --cov=src/prodml --cov-fail-under=70

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (taxi API)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prodml-api:latest

      - name: Build and push (RAG API)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.rag
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prodml-rag:latest
