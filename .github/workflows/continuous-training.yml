name: Continuous Training Pipeline

on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch: 
    inputs:
      data_version:
        description: 'Data version to pull'
        required: false
        default: 'latest'
  repository_dispatch: 
    types: [drift_detected]

jobs:
  training-and-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: CT Pipeline (DVC Pull, Train, Evaluate)
        run: |
          echo "Pulling data version: ${{ github.event.inputs.data_version }}..."
          echo "Training new model..."
          echo "Evaluating candidate against Production model..."
          echo "Candidate beats Production MAE! Promoting to Staging..."
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Staging Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prodml-api:staging

  production-deployment:
    needs: training-and-staging
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Promote to Production
        run: echo "Human approval received! Model is now live in Production."
